services:
  workspace:
    image: mcr.microsoft.com/devcontainers/java:1-21-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/SOAT-FIAP:cached
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/autocarehub
      DB_USERNAME: autocarehub
      DB_PASSWORD: autocarehub-local-password
      JWT_SECRET: codespaces-local-jwt-secret-at-least-32-bytes
      JWT_EXPIRATION_MINUTES: 60
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: autocarehub
      POSTGRES_USER: autocarehub
      POSTGRES_PASSWORD: autocarehub-local-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocarehub -d autocarehub"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
