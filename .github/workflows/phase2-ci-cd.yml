name: Phase 2 CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend unit tests
        working-directory: backend
        run: mvn -B test

      - name: Backend integration tests and coverage gate
        working-directory: backend
        run: mvn -B verify

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      JWT_SECRET: ci-jwt-secret-with-at-least-32-bytes
      EXTERNAL_SERVICE_TOKEN: ci-external-service-token
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build -f Dockerfile -t autocarehub-api:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t autocarehub-web:ci ./frontend

  local-kubernetes-deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    env:
      TF_VAR_postgres_password: ci-postgres-password
      TF_VAR_jwt_secret: ci-jwt-secret-with-at-least-32-bytes
      TF_VAR_external_service_token: ci-external-service-token
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        working-directory: infra
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Create local Kubernetes cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: autocarehub-ci
          wait: 120s

      - name: Build backend image for local cluster
        run: docker build -f Dockerfile -t autocarehub-api:local .

      - name: Build frontend image for local cluster
        run: docker build -f frontend/Dockerfile -t autocarehub-web:local ./frontend

      - name: Load images into local cluster
        run: |
          kind load docker-image autocarehub-api:local --name autocarehub-ci
          kind load docker-image autocarehub-web:local --name autocarehub-ci

      - name: Provision Kubernetes base with Terraform
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Apply Kubernetes workloads
        run: |
          kubectl apply \
            -f k8s/backend-deployment.yaml \
            -f k8s/backend-service.yaml \
            -f k8s/backend-hpa.yaml \
            -f k8s/frontend-deployment.yaml \
            -f k8s/frontend-service.yaml \
            -f k8s/frontend-hpa.yaml

      - name: Validate rollout
        run: |
          kubectl rollout status deployment/autocarehub-postgres -n autocarehub --timeout=180s
          kubectl rollout status deployment/autocarehub-api -n autocarehub --timeout=180s
          kubectl rollout status deployment/autocarehub-web -n autocarehub --timeout=180s
          kubectl get pods -n autocarehub
          kubectl get svc -n autocarehub
          kubectl get hpa -n autocarehub
