name: Phase 2 CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/autocarehub-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/autocarehub-web
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend build and tests
        working-directory: backend
        run: mvn -B test

      - name: Backend coverage gate
        working-directory: backend
        run: mvn -B verify

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      JWT_SECRET: ci-jwt-secret-with-at-least-32-bytes
      EXTERNAL_SERVICE_TOKEN: ci-external-service-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Docker login
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -f Dockerfile -t "${BACKEND_IMAGE}:${IMAGE_TAG}" -t "${BACKEND_IMAGE}:latest" .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t "${FRONTEND_IMAGE}:${IMAGE_TAG}" -t "${FRONTEND_IMAGE}:latest" ./frontend

      - name: Push images
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${BACKEND_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          docker push "${FRONTEND_IMAGE}:latest"

  deploy-kubernetes:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      EXTERNAL_SERVICE_TOKEN: ${{ secrets.EXTERNAL_SERVICE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: env.KUBE_CONFIG != '' && env.POSTGRES_PASSWORD != '' && env.JWT_SECRET != '' && env.EXTERNAL_SERVICE_TOKEN != ''
        run: |
          mkdir -p "${HOME}/.kube"
          echo "${KUBE_CONFIG}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Apply Kubernetes manifests
        if: env.KUBE_CONFIG != '' && env.POSTGRES_PASSWORD != '' && env.JWT_SECRET != '' && env.EXTERNAL_SERVICE_TOKEN != ''
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl -n autocarehub create secret generic autocarehub-secret \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=DB_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --from-literal=EXTERNAL_SERVICE_TOKEN="${EXTERNAL_SERVICE_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply \
            -f k8s/postgres-deployment.yaml \
            -f k8s/postgres-service.yaml \
            -f k8s/backend-deployment.yaml \
            -f k8s/backend-service.yaml \
            -f k8s/backend-hpa.yaml \
            -f k8s/frontend-deployment.yaml \
            -f k8s/frontend-service.yaml \
            -f k8s/frontend-hpa.yaml

      - name: Apply workflow images
        if: env.KUBE_CONFIG != '' && env.POSTGRES_PASSWORD != '' && env.JWT_SECRET != '' && env.EXTERNAL_SERVICE_TOKEN != ''
        run: |
          kubectl -n autocarehub set image deployment/autocarehub-api api="${BACKEND_IMAGE}:${IMAGE_TAG}"
          kubectl -n autocarehub set image deployment/autocarehub-web web="${FRONTEND_IMAGE}:${IMAGE_TAG}"

      - name: Validate rollout
        if: env.KUBE_CONFIG != '' && env.POSTGRES_PASSWORD != '' && env.JWT_SECRET != '' && env.EXTERNAL_SERVICE_TOKEN != ''
        run: |
          kubectl rollout status deployment/autocarehub-postgres -n autocarehub --timeout=180s
          kubectl rollout status deployment/autocarehub-api -n autocarehub --timeout=180s
          kubectl rollout status deployment/autocarehub-web -n autocarehub --timeout=180s
          kubectl get pods -n autocarehub
          kubectl get svc -n autocarehub
          kubectl get hpa -n autocarehub

      - name: Explain skipped deploy
        if: env.KUBE_CONFIG == '' || env.POSTGRES_PASSWORD == '' || env.JWT_SECRET == '' || env.EXTERNAL_SERVICE_TOKEN == ''
        run: |
          echo "Deploy Kubernetes pulado."
          echo "Configure KUBE_CONFIG, POSTGRES_PASSWORD, JWT_SECRET e EXTERNAL_SERVICE_TOKEN para executar kubectl apply -f k8s/ com secrets reais."
