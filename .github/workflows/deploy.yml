name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/autocarehub-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/autocarehub-web
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test-and-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Backend tests and coverage
        run: mvn -B verify

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      - name: Validate Kubernetes YAML structure
        run: |
          ruby -ryaml -e '
            Dir["k8s/*.yaml"].sort.each do |path|
              docs = YAML.load_stream(File.read(path)).compact
              abort("#{path}: empty YAML") if docs.empty?
              docs.each do |doc|
                %w[apiVersion kind metadata].each do |key|
                  abort("#{path}: missing #{key}") unless doc.key?(key)
                end
              end
            end
            puts "Kubernetes YAML structure validated"
          '

      - name: Terraform format check
        working-directory: infra
        run: terraform fmt -check

      - name: Terraform init for validation
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Docker login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t "${BACKEND_IMAGE}:${IMAGE_TAG}" -t "${BACKEND_IMAGE}:latest" .

      - name: Build frontend image
        run: docker build -t "${FRONTEND_IMAGE}:${IMAGE_TAG}" -t "${FRONTEND_IMAGE}:latest" ./frontend

      - name: Push images
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${BACKEND_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          docker push "${FRONTEND_IMAGE}:latest"

  deploy-kubernetes:
    runs-on: ubuntu-latest
    needs: build-test-and-image
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: env.KUBE_CONFIG != '' && env.POSTGRES_PASSWORD != '' && env.JWT_SECRET != ''
        run: |
          mkdir -p "${HOME}/.kube"
          echo "${KUBE_CONFIG}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Apply namespace, config and database storage
        if: env.KUBE_CONFIG != '' && env.POSTGRES_PASSWORD != '' && env.JWT_SECRET != ''
        run: |
          kubectl apply \
            -f k8s/00-namespace.yaml \
            -f k8s/01-configmap.yaml \
            -f k8s/03-postgres-pvc.yaml

      - name: Apply runtime secrets
        if: env.KUBE_CONFIG != '' && env.POSTGRES_PASSWORD != '' && env.JWT_SECRET != ''
        run: |
          kubectl -n autocarehub create secret generic autocarehub-secret \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=DB_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply database and application workloads
        if: env.KUBE_CONFIG != '' && env.POSTGRES_PASSWORD != '' && env.JWT_SECRET != ''
        run: |
          kubectl apply \
            -f k8s/04-postgres-deployment.yaml \
            -f k8s/05-postgres-service.yaml \
            -f k8s/06-backend-deployment.yaml \
            -f k8s/07-backend-service.yaml \
            -f k8s/08-backend-hpa.yaml \
            -f k8s/09-frontend-deployment.yaml \
            -f k8s/10-frontend-service.yaml \
            -f k8s/11-frontend-hpa.yaml

      - name: Use images built by this workflow
        if: env.KUBE_CONFIG != '' && env.POSTGRES_PASSWORD != '' && env.JWT_SECRET != ''
        run: |
          kubectl -n autocarehub set image deployment/autocarehub-api api="${BACKEND_IMAGE}:${IMAGE_TAG}"
          kubectl -n autocarehub set image deployment/autocarehub-web web="${FRONTEND_IMAGE}:${IMAGE_TAG}"

      - name: Show rollout state
        if: env.KUBE_CONFIG != '' && env.POSTGRES_PASSWORD != '' && env.JWT_SECRET != ''
        run: |
          kubectl rollout status deployment/autocarehub-postgres -n autocarehub --timeout=180s
          kubectl rollout status deployment/autocarehub-api -n autocarehub --timeout=180s
          kubectl rollout status deployment/autocarehub-web -n autocarehub --timeout=180s
          kubectl get deploy -n autocarehub -o wide
          kubectl get pods -n autocarehub
          kubectl get svc -n autocarehub
          kubectl get hpa -n autocarehub

      - name: Explain skipped deploy
        if: env.KUBE_CONFIG == '' || env.POSTGRES_PASSWORD == '' || env.JWT_SECRET == ''
        run: |
          echo "Deploy real não executado."
          echo "Configure KUBE_CONFIG, POSTGRES_PASSWORD e JWT_SECRET nos GitHub Actions Secrets para aplicar os manifests no Kubernetes."
