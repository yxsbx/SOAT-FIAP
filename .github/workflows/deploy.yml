name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/autocarehub-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/autocarehub-web

jobs:
  build-test-and-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests and coverage
        run: mvn -B verify

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      - name: Docker login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t "${BACKEND_IMAGE}:${GITHUB_SHA}" -t "${BACKEND_IMAGE}:latest" .

      - name: Build frontend image
        run: docker build -t "${FRONTEND_IMAGE}:${GITHUB_SHA}" -t "${FRONTEND_IMAGE}:latest" ./frontend

      - name: Push images
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker push "${BACKEND_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"
          docker push "${FRONTEND_IMAGE}:latest"

  deploy-kubernetes:
    runs-on: ubuntu-latest
    needs: build-test-and-image
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: kubectl apply --dry-run=client -f k8s/

      - name: Configure kubeconfig
        if: env.KUBE_CONFIG != ''
        run: |
          mkdir -p "${HOME}/.kube"
          echo "${KUBE_CONFIG}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Apply manifests
        if: env.KUBE_CONFIG != ''
        run: kubectl apply -f k8s/

      - name: Show rollout state
        if: env.KUBE_CONFIG != ''
        run: |
          kubectl rollout status deployment/autocarehub-api -n autocarehub --timeout=180s
          kubectl get pods -n autocarehub
          kubectl get svc -n autocarehub
          kubectl get hpa -n autocarehub

