apiVersion: apps/v1
kind: Deployment
metadata:
  name: autocarehub-api
  namespace: autocarehub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autocarehub-api
  template:
    metadata:
      labels:
        app: autocarehub-api
    spec:
      containers:
        - name: api
          image: ghcr.io/yxsbx/autocarehub-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: autocarehub-config
            - secretRef:
                name: autocarehub-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: autocarehub-api
  namespace: autocarehub
spec:
  type: ClusterIP
  selector:
    app: autocarehub-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autocarehub-api
  namespace: autocarehub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autocarehub-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

