services:
  postgres:
    image: postgres:16
    container_name: autocarehub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autocarehub}
      POSTGRES_USER: ${POSTGRES_USER:-autocarehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - autocarehub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autocarehub} -d ${POSTGRES_DB:-autocarehub}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autocarehub-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-autocarehub}
      DB_USERNAME: ${POSTGRES_USER:-autocarehub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  autocarehub-postgres-data:
