spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: autocare-hub-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:autocarehub}}
    username: ${DB_USERNAME:${POSTGRES_USER:autocarehub}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:autocarehub}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    url: /openapi.yaml

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
