spring:
    application:
        name: autocare-hub-api
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/autocarehub}
        username: ${DB_USERNAME:autocarehub}
        password: ${DB_PASSWORD:autocarehub}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                format_sql: true
    flyway:
        enabled: true
        locations: classpath:db/migration

server:
    port: ${SERVER_PORT:8080}

springdoc:
    swagger-ui:
        url: /openapi.yaml

security:
    jwt:
        secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
        expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
