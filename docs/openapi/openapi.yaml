openapi: 3.0.3
info:
    title: AutoCare Hub API
    version: 1.0.0
    description: API para gerenciamento de clientes, veículos, serviços, peças, ordens de serviço, orçamentos, aprovacoes e acompanhamento de status de uma oficina mecânica.
servers:
    -   url: http://localhost:8080
        description: Ambiente local
security:
    -   bearerAuth: [ ]
tags:
    -   name: Auth
        description: Autenticação e emissao de token JWT
    -   name: Customers
        description: Cadastro e manutenção de clientes
    -   name: Vehicles
        description: Cadastro e manutenção de veículos
    -   name: Workshop Services
        description: Cadastro e manutenção dos serviços oferecidos pela oficina
    -   name: Parts
        description: Cadastro, manutenção e controle de estoque de peças e insumos
    -   name: Service Orders
        description: Criação, composição, orçamento, aprovação e acompanhamento de ordens de serviço
paths:
    /api/v1/auth/login:
        post:
            tags:
                - Auth
            summary: Autentica um usuario
            operationId: login
            security: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
            responses:
                "200":
                    description: Login realizado com sucesso
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/LoginResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
    /api/v1/customers:
        post:
            tags:
                - Customers
            summary: Cria um cliente
            operationId: createCustomer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateCustomerRequest"
            responses:
                "201":
                    description: Cliente criado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CustomerResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
        get:
            tags:
                - Customers
            summary: Lista clientes
            operationId: listCustomers
            parameters:
                -   $ref: "#/components/parameters/PageParam"
                -   $ref: "#/components/parameters/SizeParam"
                -   name: active
                    in: query
                    required: false
                    schema:
                        type: boolean
            responses:
                "200":
                    description: Clientes encontrados
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CustomerListResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
    /api/v1/customers/{customerId}:
        get:
            tags:
                - Customers
            summary: Busca um cliente por id
            operationId: getCustomerById
            parameters:
                -   $ref: "#/components/parameters/CustomerIdPathParam"
            responses:
                "200":
                    description: Cliente encontrado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CustomerResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
        put:
            tags:
                - Customers
            summary: Atualiza um cliente
            operationId: updateCustomer
            parameters:
                -   $ref: "#/components/parameters/CustomerIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateCustomerRequest"
            responses:
                "200":
                    description: Cliente atualizado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CustomerResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
        delete:
            tags:
                - Customers
            summary: Remove logicamente um cliente
            operationId: deleteCustomer
            parameters:
                -   $ref: "#/components/parameters/CustomerIdPathParam"
            responses:
                "204":
                    description: Cliente removido
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/customers/{customerId}/vehicles:
        get:
            tags:
                - Vehicles
            summary: Lista veículos de um cliente
            operationId: listVehiclesByCustomer
            parameters:
                -   $ref: "#/components/parameters/CustomerIdPathParam"
            responses:
                "200":
                    description: Veículos encontrados
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/VehicleListResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/customers/{customerId}/service-orders:
        get:
            tags:
                - Service Orders
            summary: Lista ordens de serviço de um cliente
            operationId: listServiceOrdersByCustomer
            parameters:
                -   $ref: "#/components/parameters/CustomerIdPathParam"
            responses:
                "200":
                    description: Ordens de serviço encontradas
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceOrderListResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/vehicles:
        post:
            tags:
                - Vehicles
            summary: Cria um veículo
            operationId: createVehicle
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateVehicleRequest"
            responses:
                "201":
                    description: Veículo criado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/VehicleResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
        get:
            tags:
                - Vehicles
            summary: Lista veículos
            operationId: listVehicles
            parameters:
                -   $ref: "#/components/parameters/PageParam"
                -   $ref: "#/components/parameters/SizeParam"
                -   name: active
                    in: query
                    required: false
                    schema:
                        type: boolean
            responses:
                "200":
                    description: Veículos encontrados
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/VehicleListResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
    /api/v1/vehicles/{vehicleId}:
        get:
            tags:
                - Vehicles
            summary: Busca um veículo por id
            operationId: getVehicleById
            parameters:
                -   $ref: "#/components/parameters/VehicleIdPathParam"
            responses:
                "200":
                    description: Veículo encontrado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/VehicleResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
        put:
            tags:
                - Vehicles
            summary: Atualiza um veículo
            operationId: updateVehicle
            parameters:
                -   $ref: "#/components/parameters/VehicleIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateVehicleRequest"
            responses:
                "200":
                    description: Veículo atualizado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/VehicleResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
        delete:
            tags:
                - Vehicles
            summary: Remove logicamente um veículo
            operationId: deleteVehicle
            parameters:
                -   $ref: "#/components/parameters/VehicleIdPathParam"
            responses:
                "204":
                    description: Veículo removido
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/workshop-services:
        post:
            tags:
                - Workshop Services
            summary: Cria um serviço da oficina
            operationId: createWorkshopService
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateWorkshopServiceRequest"
            responses:
                "201":
                    description: Servico criado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/WorkshopServiceResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
        get:
            tags:
                - Workshop Services
            summary: Lista serviços da oficina
            operationId: listWorkshopServices
            parameters:
                -   $ref: "#/components/parameters/PageParam"
                -   $ref: "#/components/parameters/SizeParam"
                -   name: active
                    in: query
                    required: false
                    schema:
                        type: boolean
            responses:
                "200":
                    description: Serviços encontrados
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/WorkshopServiceListResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
    /api/v1/workshop-services/{serviceId}:
        get:
            tags:
                - Workshop Services
            summary: Busca um serviço da oficina por id
            operationId: getWorkshopServiceById
            parameters:
                -   $ref: "#/components/parameters/ServiceIdPathParam"
            responses:
                "200":
                    description: Servico encontrado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/WorkshopServiceResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
        put:
            tags:
                - Workshop Services
            summary: Atualiza um serviço da oficina
            operationId: updateWorkshopService
            parameters:
                -   $ref: "#/components/parameters/ServiceIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateWorkshopServiceRequest"
            responses:
                "200":
                    description: Servico atualizado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/WorkshopServiceResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
        delete:
            tags:
                - Workshop Services
            summary: Remove logicamente um serviço da oficina
            operationId: deleteWorkshopService
            parameters:
                -   $ref: "#/components/parameters/ServiceIdPathParam"
            responses:
                "204":
                    description: Servico removido
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/parts:
        post:
            tags:
                - Parts
            summary: Cria uma peça ou insumo
            operationId: createPart
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreatePartRequest"
            responses:
                "201":
                    description: Peça criada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PartResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
        get:
            tags:
                - Parts
            summary: Lista peças e insumos
            operationId: listParts
            parameters:
                -   $ref: "#/components/parameters/PageParam"
                -   $ref: "#/components/parameters/SizeParam"
                -   name: active
                    in: query
                    required: false
                    schema:
                        type: boolean
                -   name: lowStock
                    in: query
                    required: false
                    schema:
                        type: boolean
            responses:
                "200":
                    description: Peças encontradas
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PartListResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
    /api/v1/parts/{partId}:
        get:
            tags:
                - Parts
            summary: Busca uma peça por id
            operationId: getPartById
            parameters:
                -   $ref: "#/components/parameters/PartIdPathParam"
            responses:
                "200":
                    description: Peça encontrada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PartResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
        put:
            tags:
                - Parts
            summary: Atualiza uma peça ou insumo
            operationId: updatePart
            parameters:
                -   $ref: "#/components/parameters/PartIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdatePartRequest"
            responses:
                "200":
                    description: Peça atualizada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PartResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
        delete:
            tags:
                - Parts
            summary: Remove logicamente uma peça ou insumo
            operationId: deletePart
            parameters:
                -   $ref: "#/components/parameters/PartIdPathParam"
            responses:
                "204":
                    description: Peça removida
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/parts/{partId}/stock:
        patch:
            tags:
                - Parts
            summary: Atualiza o estoque de uma peça ou insumo
            operationId: updatePartStock
            parameters:
                -   $ref: "#/components/parameters/PartIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdatePartStockRequest"
            responses:
                "200":
                    description: Estoque atualizado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PartResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/parts/{partId}/stock-movement:
        patch:
            tags:
                - Parts
            summary: Registra entrada, saida ou venda isolada de uma peça
            operationId: registerStockMovement
            parameters:
                -   $ref: "#/components/parameters/PartIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/StockMovementRequest"
            responses:
                "200":
                    description: Movimento registrado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PartResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/parts/{partId}/reservation:
        patch:
            tags:
                - Parts
            summary: Configura o prazo de reserva de estoque para orçamentos
            operationId: configurePartReservation
            parameters:
                -   $ref: "#/components/parameters/PartIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ConfigurePartReservationRequest"
            responses:
                "200":
                    description: Prazo de reserva configurado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PartResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/parts/{partId}/reserve:
        patch:
            tags:
                - Parts
            summary: Bloqueia quantidade de uma peça para um orçamento
            operationId: reservePart
            parameters:
                -   $ref: "#/components/parameters/PartIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/PartQuantityRequest"
            responses:
                "200":
                    description: Estoque reservado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PartResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/parts/{partId}/release-reservation:
        patch:
            tags:
                - Parts
            summary: Libera quantidade previamente reservada
            operationId: releaseReservation
            parameters:
                -   $ref: "#/components/parameters/PartIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/PartQuantityRequest"
            responses:
                "200":
                    description: Reserva liberada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PartResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/parts/{partId}/commit-reservation:
        patch:
            tags:
                - Parts
            summary: Converte reserva em baixa definitiva de estoque
            operationId: commitReservation
            parameters:
                -   $ref: "#/components/parameters/PartIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CommitPartReservationRequest"
            responses:
                "200":
                    description: Reserva baixada do estoque
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PartResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/service-orders:
        post:
            tags:
                - Service Orders
            summary: Cria uma ordem de serviço identificando o cliente por CPF ou CNPJ
            operationId: createServiceOrder
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateServiceOrderRequest"
            responses:
                "201":
                    description: Ordem de serviço criada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceOrderResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
        get:
            tags:
                - Service Orders
            summary: Lista ordens de serviço
            operationId: listServiceOrders
            parameters:
                -   $ref: "#/components/parameters/PageParam"
                -   $ref: "#/components/parameters/SizeParam"
                -   name: status
                    in: query
                    required: false
                    schema:
                        $ref: "#/components/schemas/ServiceOrderStatus"
                -   name: customerId
                    in: query
                    required: false
                    schema:
                        type: string
                        format: uuid
                -   name: vehicleId
                    in: query
                    required: false
                    schema:
                        type: string
                        format: uuid
                -   name: createdFrom
                    in: query
                    required: false
                    schema:
                        type: string
                        format: date-time
                -   name: createdTo
                    in: query
                    required: false
                    schema:
                        type: string
                        format: date-time
            responses:
                "200":
                    description: Ordens de serviço encontradas
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceOrderListResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
    /api/v1/service-orders/metrics/average-execution-time:
        get:
            tags:
                - Service Orders
            summary: Consulta o tempo medio de execução das ordens de serviço finalizadas
            operationId: getAverageServiceOrderExecutionTime
            responses:
                "200":
                    description: Tempo medio calculado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AverageExecutionTimeResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
    /api/v1/service-orders/tracking:
        get:
            tags:
                - Service Orders
            summary: Acompanha o progresso de ordens de serviço pelo cliente
            description: Consulte por id da OS ou por CPF/CNPJ do cliente junto com a placa do veículo.
            operationId: trackServiceOrders
            parameters:
                -   name: serviceOrderId
                    in: query
                    required: false
                    schema:
                        type: string
                        format: uuid
                -   name: customerDocument
                    in: query
                    required: false
                    schema:
                        type: string
                        minLength: 11
                        maxLength: 18
                        pattern: "^\\d{11}$|^\\d{14}$|^\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}$|^\\d{2}\\.\\d{3}\\.\\d{3}/\\d{4}-\\d{2}$"
                -   name: plate
                    in: query
                    required: false
                    schema:
                        type: string
                        minLength: 7
                        maxLength: 8
                        pattern: "^[A-Za-z]{3}-?[0-9]{4}$|^[A-Za-z]{3}-?[0-9][A-Za-z][0-9]{2}$"
            responses:
                "200":
                    description: Progresso da ordem encontrado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceOrderTrackingListResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/service-orders/{serviceOrderId}:
        get:
            tags:
                - Service Orders
            summary: Busca uma ordem de serviço por id
            operationId: getServiceOrderById
            parameters:
                -   $ref: "#/components/parameters/ServiceOrderIdPathParam"
            responses:
                "200":
                    description: Ordem de serviço encontrada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceOrderResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/service-orders/{serviceOrderId}/services:
        post:
            tags:
                - Service Orders
            summary: Adiciona um serviço a uma ordem de serviço
            operationId: addServiceToServiceOrder
            parameters:
                -   $ref: "#/components/parameters/ServiceOrderIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AddServiceOrderServiceRequest"
            responses:
                "200":
                    description: Servico adicionado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceOrderResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/service-orders/{serviceOrderId}/parts:
        post:
            tags:
                - Service Orders
            summary: Adiciona uma peça a uma ordem de serviço
            operationId: addPartToServiceOrder
            parameters:
                -   $ref: "#/components/parameters/ServiceOrderIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AddServiceOrderPartRequest"
            responses:
                "200":
                    description: Peça adicionada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceOrderResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/service-orders/{serviceOrderId}/budget/generate:
        post:
            tags:
                - Service Orders
            summary: Gera o orçamento de uma ordem de serviço
            operationId: generateServiceOrderBudget
            parameters:
                -   $ref: "#/components/parameters/ServiceOrderIdPathParam"
            responses:
                "200":
                    description: Orcamento gerado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceOrderResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/service-orders/{serviceOrderId}/budget/approve:
        post:
            tags:
                - Service Orders
            summary: Aprova o orçamento de uma ordem de serviço
            operationId: approveServiceOrderBudget
            parameters:
                -   $ref: "#/components/parameters/ServiceOrderIdPathParam"
            responses:
                "200":
                    description: Orcamento aprovado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceOrderResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/v1/service-orders/{serviceOrderId}/status:
        patch:
            tags:
                - Service Orders
            summary: Atualiza o status de uma ordem de serviço
            operationId: updateServiceOrderStatus
            parameters:
                -   $ref: "#/components/parameters/ServiceOrderIdPathParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateServiceOrderStatusRequest"
            responses:
                "200":
                    description: Status atualizado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ServiceOrderResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    parameters:
        PageParam:
            name: page
            in: query
            required: false
            schema:
                type: integer
                minimum: 0
                default: 0
        SizeParam:
            name: size
            in: query
            required: false
            schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
        CustomerIdPathParam:
            name: customerId
            in: path
            required: true
            schema:
                type: string
                format: uuid
        VehicleIdPathParam:
            name: vehicleId
            in: path
            required: true
            schema:
                type: string
                format: uuid
        ServiceIdPathParam:
            name: serviceId
            in: path
            required: true
            schema:
                type: string
                format: uuid
        PartIdPathParam:
            name: partId
            in: path
            required: true
            schema:
                type: string
                format: uuid
        ServiceOrderIdPathParam:
            name: serviceOrderId
            in: path
            required: true
            schema:
                type: string
                format: uuid
    responses:
        BadRequest:
            description: Requisição invalida
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        Unauthorized:
            description: Credenciais ausentes ou invalidas
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        NotFound:
            description: Recurso nao encontrado
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
    schemas:
        LoginRequest:
            type: object
            required:
                - username
                - password
            properties:
                username:
                    type: string
                    minLength: 3
                    maxLength: 120
                    example: admin@autocarehub.com
                password:
                    type: string
                    minLength: 8
                    maxLength: 120
                    format: password
                    example: autocare123
        LoginResponse:
            type: object
            required:
                - accessToken
                - tokenType
                - expiresIn
            properties:
                accessToken:
                    type: string
                    minLength: 1
                tokenType:
                    type: string
                    example: Bearer
                expiresIn:
                    type: integer
                    format: int64
                    minimum: 1
                    example: 3600
        Address:
            type: object
            required:
                - street
                - number
                - neighborhood
                - city
                - state
                - zipCode
            properties:
                street:
                    type: string
                    minLength: 2
                    maxLength: 120
                    example: Avenida Paulista
                number:
                    type: string
                    minLength: 1
                    maxLength: 20
                    example: "1000"
                complement:
                    type: string
                    maxLength: 80
                    example: Sala 10
                neighborhood:
                    type: string
                    minLength: 2
                    maxLength: 80
                    example: Bela Vista
                city:
                    type: string
                    minLength: 2
                    maxLength: 80
                    example: Sao Paulo
                state:
                    type: string
                    minLength: 2
                    maxLength: 2
                    example: SP
                zipCode:
                    type: string
                    minLength: 8
                    maxLength: 9
                    pattern: "^\\d{5}-?\\d{3}$"
                    example: 01310-100
        CreateCustomerRequest:
            type: object
            required:
                - name
                - document
                - phone
                - email
                - address
            properties:
                name:
                    type: string
                    minLength: 2
                    maxLength: 120
                document:
                    type: string
                    minLength: 11
                    maxLength: 18
                    pattern: "^\\d{11}$|^\\d{14}$|^\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}$|^\\d{2}\\.\\d{3}\\.\\d{3}/\\d{4}-\\d{2}$"
                    description: CPF ou CNPJ com ou sem formatacao.
                phone:
                    type: string
                    minLength: 10
                    maxLength: 20
                email:
                    type: string
                    format: email
                    maxLength: 120
                address:
                    $ref: "#/components/schemas/Address"
        UpdateCustomerRequest:
            allOf:
                -   $ref: "#/components/schemas/CreateCustomerRequest"
                -   type: object
                    required:
                        - active
                    properties:
                        active:
                            type: boolean
        CustomerResponse:
            type: object
            required:
                - id
                - name
                - document
                - phone
                - email
                - address
                - active
                - createdAt
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                document:
                    type: string
                phone:
                    type: string
                email:
                    type: string
                    format: email
                address:
                    $ref: "#/components/schemas/Address"
                active:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
        CustomerListResponse:
            type: object
            required:
                - items
                - page
                - size
                - totalItems
                - totalPages
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/CustomerResponse"
                page:
                    type: integer
                    minimum: 0
                size:
                    type: integer
                    minimum: 1
                totalItems:
                    type: integer
                    format: int64
                    minimum: 0
                totalPages:
                    type: integer
                    minimum: 0
        CreateVehicleRequest:
            type: object
            required:
                - customerId
                - plate
                - brand
                - model
                - year
                - mileage
            properties:
                customerId:
                    type: string
                    format: uuid
                plate:
                    type: string
                    minLength: 7
                    maxLength: 8
                    pattern: "^[A-Za-z]{3}-?[0-9]{4}$|^[A-Za-z]{3}-?[0-9][A-Za-z][0-9]{2}$"
                    example: ABC1D23
                brand:
                    type: string
                    minLength: 2
                    maxLength: 60
                model:
                    type: string
                    minLength: 1
                    maxLength: 80
                year:
                    type: integer
                    minimum: 1900
                    maximum: 2100
                mileage:
                    type: integer
                    minimum: 0
        UpdateVehicleRequest:
            allOf:
                -   $ref: "#/components/schemas/CreateVehicleRequest"
                -   type: object
                    required:
                        - active
                    properties:
                        active:
                            type: boolean
        VehicleResponse:
            type: object
            required:
                - id
                - customerId
                - plate
                - brand
                - model
                - year
                - mileage
                - active
            properties:
                id:
                    type: string
                    format: uuid
                customerId:
                    type: string
                    format: uuid
                plate:
                    type: string
                brand:
                    type: string
                model:
                    type: string
                year:
                    type: integer
                mileage:
                    type: integer
                active:
                    type: boolean
        VehicleListResponse:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/VehicleResponse"
        CreateWorkshopServiceRequest:
            type: object
            required:
                - name
                - description
                - basePrice
                - estimatedTimeInMinutes
            properties:
                name:
                    type: string
                    minLength: 2
                    maxLength: 100
                description:
                    type: string
                    minLength: 5
                    maxLength: 500
                basePrice:
                    type: number
                    format: double
                    minimum: 0
                estimatedTimeInMinutes:
                    type: integer
                    minimum: 1
        UpdateWorkshopServiceRequest:
            allOf:
                -   $ref: "#/components/schemas/CreateWorkshopServiceRequest"
                -   type: object
                    required:
                        - active
                    properties:
                        active:
                            type: boolean
        WorkshopServiceResponse:
            type: object
            required:
                - id
                - name
                - description
                - basePrice
                - estimatedTimeInMinutes
                - active
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                description:
                    type: string
                basePrice:
                    type: number
                    format: double
                estimatedTimeInMinutes:
                    type: integer
                active:
                    type: boolean
        WorkshopServiceListResponse:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/WorkshopServiceResponse"
        CreatePartRequest:
            type: object
            required:
                - name
                - description
                - sku
                - category
                - brand
                - unitPrice
                - stockQuantity
                - minimumStock
            properties:
                name:
                    type: string
                    minLength: 2
                    maxLength: 120
                description:
                    type: string
                    minLength: 3
                    maxLength: 500
                sku:
                    type: string
                    minLength: 3
                    maxLength: 60
                category:
                    type: string
                    minLength: 2
                    maxLength: 80
                subcategory:
                    type: string
                    maxLength: 80
                brand:
                    type: string
                    minLength: 2
                    maxLength: 80
                unitPrice:
                    type: number
                    format: double
                    minimum: 0
                costPrice:
                    type: number
                    format: double
                    minimum: 0
                stockQuantity:
                    type: integer
                    minimum: 0
                minimumStock:
                    type: integer
                    minimum: 0
        UpdatePartRequest:
            allOf:
                -   $ref: "#/components/schemas/CreatePartRequest"
                -   type: object
                    required:
                        - active
                    properties:
                        active:
                            type: boolean
        UpdatePartStockRequest:
            type: object
            required:
                - stockQuantity
            properties:
                stockQuantity:
                    type: integer
                    minimum: 0
        StockMovementRequest:
            type: object
            required:
                - type
                - quantity
            properties:
                type:
                    type: string
                    enum:
                        - ENTRY
                        - EXIT
                        - SALE
                quantity:
                    type: integer
                    minimum: 1
                unitCost:
                    type: number
                    format: double
                    minimum: 0
                unitPrice:
                    type: number
                    format: double
                    minimum: 0
                reason:
                    type: string
                    maxLength: 255
        ConfigurePartReservationRequest:
            type: object
            required:
                - reservationDays
            properties:
                reservationDays:
                    type: integer
                    minimum: 1
        PartQuantityRequest:
            type: object
            required:
                - quantity
            properties:
                quantity:
                    type: integer
                    minimum: 1
        CommitPartReservationRequest:
            allOf:
                -   $ref: "#/components/schemas/PartQuantityRequest"
                -   type: object
                    properties:
                        reason:
                            type: string
                            maxLength: 255
        PartResponse:
            type: object
            required:
                - id
                - name
                - description
                - sku
                - category
                - brand
                - unitPrice
                - costPrice
                - stockQuantity
                - reservedQuantity
                - minimumStock
                - stockStatus
                - active
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                description:
                    type: string
                sku:
                    type: string
                category:
                    type: string
                subcategory:
                    type: string
                brand:
                    type: string
                unitPrice:
                    type: number
                    format: double
                costPrice:
                    type: number
                    format: double
                stockQuantity:
                    type: integer
                reservedQuantity:
                    type: integer
                availableQuantity:
                    type: integer
                minimumStock:
                    type: integer
                reservationDays:
                    type: integer
                reservationExpiresAt:
                    type: string
                    format: date-time
                stockStatus:
                    type: string
                active:
                    type: boolean
        PartListResponse:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/PartResponse"
        CreateServiceOrderRequest:
            type: object
            required:
                - customerDocument
                - diagnosticNotes
                - services
            properties:
                customerDocument:
                    type: string
                    minLength: 11
                    maxLength: 18
                    pattern: "^\\d{11}$|^\\d{14}$|^\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}$|^\\d{2}\\.\\d{3}\\.\\d{3}/\\d{4}-\\d{2}$"
                    example: "12345678909"
                    description: CPF ou CNPJ do cliente com ou sem formatacao. Se o cliente nao existir, informe tambem customer.
                customer:
                    $ref: "#/components/schemas/CreateServiceOrderCustomerRequest"
                vehicleId:
                    type: string
                    format: uuid
                    description: Identificador de veículo ja cadastrado. Se ausente, informe vehicle para cadastro ou vinculo por placa.
                vehicle:
                    $ref: "#/components/schemas/CreateServiceOrderVehicleRequest"
                diagnosticNotes:
                    type: string
                    minLength: 5
                    maxLength: 2000
                services:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/CreateServiceOrderServiceRequest"
                    description: Serviços solicitados para compor automaticamente o orçamento.
                parts:
                    type: array
                    items:
                        $ref: "#/components/schemas/CreateServiceOrderPartRequest"
                    description: Peças ou insumos necessarios para compor automaticamente o orçamento.
                generateBudget:
                    type: boolean
                    default: true
                    description: Quando true, gera o orçamento automaticamente e deixa a OS aguardando aprovação.
        CreateServiceOrderCustomerRequest:
            type: object
            required:
                - name
                - phone
                - email
                - address
            properties:
                name:
                    type: string
                    minLength: 2
                    maxLength: 120
                phone:
                    type: string
                    minLength: 10
                    maxLength: 20
                email:
                    type: string
                    format: email
                    maxLength: 120
                address:
                    $ref: "#/components/schemas/Address"
        CreateServiceOrderVehicleRequest:
            type: object
            required:
                - plate
                - brand
                - model
                - year
            properties:
                plate:
                    type: string
                    minLength: 7
                    maxLength: 8
                    pattern: "^[A-Za-z]{3}-?[0-9]{4}$|^[A-Za-z]{3}-?[0-9][A-Za-z][0-9]{2}$"
                    example: ABC1D23
                brand:
                    type: string
                    minLength: 2
                    maxLength: 60
                    example: Honda
                model:
                    type: string
                    minLength: 1
                    maxLength: 80
                    example: Civic
                year:
                    type: integer
                    minimum: 1900
                    example: 2020
                mileage:
                    type: integer
                    minimum: 0
                    default: 0
                    example: 35000
        CreateServiceOrderServiceRequest:
            type: object
            required:
                - serviceId
                - quantity
            properties:
                serviceId:
                    type: string
                    format: uuid
                quantity:
                    type: integer
                    minimum: 1
                    default: 1
        CreateServiceOrderPartRequest:
            type: object
            required:
                - partId
                - quantity
            properties:
                partId:
                    type: string
                    format: uuid
                quantity:
                    type: integer
                    minimum: 1
                    default: 1
        AddServiceOrderServiceRequest:
            type: object
            required:
                - serviceId
                - quantity
            properties:
                serviceId:
                    type: string
                    format: uuid
                quantity:
                    type: integer
                    minimum: 1
        AddServiceOrderPartRequest:
            type: object
            required:
                - partId
                - quantity
            properties:
                partId:
                    type: string
                    format: uuid
                quantity:
                    type: integer
                    minimum: 1
        UpdateServiceOrderStatusRequest:
            type: object
            required:
                - status
            properties:
                status:
                    $ref: "#/components/schemas/ServiceOrderStatus"
        ServiceOrderServiceItem:
            type: object
            required:
                - serviceId
                - name
                - quantity
                - unitPrice
                - totalPrice
            properties:
                serviceId:
                    type: string
                    format: uuid
                name:
                    type: string
                quantity:
                    type: integer
                    minimum: 1
                unitPrice:
                    type: number
                    format: double
                    minimum: 0
                totalPrice:
                    type: number
                    format: double
                    minimum: 0
        ServiceOrderPartItem:
            type: object
            required:
                - partId
                - name
                - sku
                - quantity
                - unitPrice
                - totalPrice
            properties:
                partId:
                    type: string
                    format: uuid
                name:
                    type: string
                sku:
                    type: string
                quantity:
                    type: integer
                    minimum: 1
                unitPrice:
                    type: number
                    format: double
                    minimum: 0
                totalPrice:
                    type: number
                    format: double
                    minimum: 0
        ServiceOrderResponse:
            type: object
            required:
                - id
                - customerId
                - vehicleId
                - status
                - diagnosticNotes
                - services
                - parts
                - servicesTotal
                - partsTotal
                - totalAmount
                - createdAt
            properties:
                id:
                    type: string
                    format: uuid
                customerId:
                    type: string
                    format: uuid
                vehicleId:
                    type: string
                    format: uuid
                status:
                    $ref: "#/components/schemas/ServiceOrderStatus"
                diagnosticNotes:
                    type: string
                services:
                    type: array
                    items:
                        $ref: "#/components/schemas/ServiceOrderServiceItem"
                parts:
                    type: array
                    items:
                        $ref: "#/components/schemas/ServiceOrderPartItem"
                servicesTotal:
                    type: number
                    format: double
                    minimum: 0
                    description: Valor total dos serviços do orçamento.
                partsTotal:
                    type: number
                    format: double
                    minimum: 0
                    description: Valor total das peças e insumos do orçamento.
                totalAmount:
                    type: number
                    format: double
                    minimum: 0
                    description: Valor total geral do orçamento.
                createdAt:
                    type: string
                    format: date-time
                budgetGeneratedAt:
                    type: string
                    format: date-time
                approvedAt:
                    type: string
                    format: date-time
                startedAt:
                    type: string
                    format: date-time
                finishedAt:
                    type: string
                    format: date-time
                deliveredAt:
                    type: string
                    format: date-time
        ServiceOrderListResponse:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/ServiceOrderResponse"
        ServiceOrderTrackingListResponse:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/ServiceOrderTrackingResponse"
        ServiceOrderTrackingResponse:
            type: object
            required:
                - id
                - customerId
                - vehicle
                - status
                - diagnosticNotes
                - services
                - parts
                - budget
                - statusHistory
                - createdAt
            properties:
                id:
                    type: string
                    format: uuid
                customerId:
                    type: string
                    format: uuid
                vehicle:
                    $ref: "#/components/schemas/VehicleResponse"
                status:
                    $ref: "#/components/schemas/ServiceOrderTrackingStatus"
                diagnosticNotes:
                    type: string
                services:
                    type: array
                    items:
                        $ref: "#/components/schemas/ServiceOrderServiceItem"
                parts:
                    type: array
                    items:
                        $ref: "#/components/schemas/ServiceOrderPartItem"
                budget:
                    $ref: "#/components/schemas/ServiceOrderBudgetTrackingResponse"
                statusHistory:
                    type: array
                    items:
                        $ref: "#/components/schemas/ServiceOrderStatusHistoryItem"
                createdAt:
                    type: string
                    format: date-time
        ServiceOrderBudgetTrackingResponse:
            type: object
            required:
                - generated
                - approved
                - servicesTotal
                - partsTotal
                - totalAmount
            properties:
                generated:
                    type: boolean
                approved:
                    type: boolean
                servicesTotal:
                    type: number
                    format: double
                    minimum: 0
                partsTotal:
                    type: number
                    format: double
                    minimum: 0
                totalAmount:
                    type: number
                    format: double
                    minimum: 0
                generatedAt:
                    type: string
                    format: date-time
                approvedAt:
                    type: string
                    format: date-time
        ServiceOrderStatusHistoryItem:
            type: object
            required:
                - status
                - occurredAt
                - description
            properties:
                status:
                    $ref: "#/components/schemas/ServiceOrderTrackingStatus"
                occurredAt:
                    type: string
                    format: date-time
                description:
                    type: string
        AverageExecutionTimeResponse:
            type: object
            required:
                - completedOrders
                - averageExecutionTimeInMinutes
            properties:
                completedOrders:
                    type: integer
                    format: int64
                    minimum: 0
                averageExecutionTimeInMinutes:
                    type: number
                    format: double
                    minimum: 0
        ServiceOrderStatus:
            type: string
            enum:
                - RECEIVED
                - IN_DIAGNOSIS
                - WAITING_APPROVAL
                - IN_PROGRESS
                - FINISHED
                - DELIVERED
        ServiceOrderTrackingStatus:
            type: string
            enum:
                - RECEBIDA
                - EM_DIAGNOSTICO
                - AGUARDANDO_APROVACAO
                - EM_EXECUCAO
                - FINALIZADA
                - ENTREGUE
        ErrorResponse:
            type: object
            required:
                - timestamp
                - status
                - error
                - message
                - path
            properties:
                timestamp:
                    type: string
                    format: date-time
                status:
                    type: integer
                    minimum: 100
                    maximum: 599
                error:
                    type: string
                    minLength: 1
                message:
                    type: string
                    minLength: 1
                path:
                    type: string
                    minLength: 1
                details:
                    type: array
                    items:
                        type: string
